<!-- Enlace de producto: navegación nativa con teclado y apertura en otra pestaña. -->
<a [routerLink]="['/products', product().id]" class="group block h-full rounded-card no-underline">
  <!-- Imagen y descuento del producto. -->
  <div class="relative aspect-square overflow-hidden rounded-card bg-surface">
    @defer (on viewport) {
      <img
        class="size-full object-contain p-4 transition-transform ease-product motion-safe:group-hover:scale-105 motion-reduce:transition-none md:p-6"
        appImgFallback
        [src]="product().thumbnail"
        [alt]="product().title"
        loading="lazy"
        width="320"
        height="320"
      />
    } @placeholder {
      <div class="size-full bg-surface" aria-hidden="true"></div>
    }
    @if (product().discountPercentage > 0) {
      <span
        class="absolute top-2.5 left-2.5 rounded-tag bg-canvas px-2 py-1 text-xs font-bold text-ink tabular-nums md:top-3.5 md:left-3.5"
        >−{{ product().discountPercentage.toFixed(0) }}%</span
      >
    }
  </div>
  <!-- Información: categoría, nombre, valoración y precio. -->
  <div class="mt-4 flex items-center justify-between gap-2 text-caption text-muted">
    <span class="wrap-anywhere capitalize">{{ product().category }}</span
    ><span class="inline-flex shrink-0 items-center gap-1 tabular-nums"
      ><svg class="size-3.5 text-rating" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
        <path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z" /></svg
      ><span class="sr-only">Rated </span>{{ product().rating.toFixed(1)
      }}<span class="sr-only"> out of 5</span></span
    >
  </div>
  <h2
    class="mt-1.5 text-base leading-card font-semibold wrap-anywhere group-hover:text-primary group-hover:underline group-hover:underline-offset-4"
  >
    {{ product().title }}
  </h2>
  <p class="mt-2 text-lg font-price tabular-nums">{{ product().price | price }}</p>
</a>
