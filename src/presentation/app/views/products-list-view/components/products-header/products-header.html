<!-- Acceso directo: navegación por teclado. -->
<a
  class="fixed -top-28 left-5 z-50 rounded-control bg-primary px-5 py-3 text-canvas focus:top-3"
  href="#main-content"
  >Skip to products</a
>
<!-- Cabecera: marca y navegación principal. -->
<header class="border-b border-line bg-canvas">
  <div
    class="mx-auto flex min-h-20 w-full max-w-shell flex-wrap items-center gap-5 px-5 py-5 md:px-12 lg:min-h-header lg:flex-nowrap lg:gap-12 lg:py-0"
  >
    <a
      class="inline-flex shrink-0 items-center gap-2 text-xl font-extrabold tracking-brand no-underline sm:gap-2.5 sm:text-2xl"
      routerLink="/"
      aria-label="Store home"
      ><svg
        class="h-8 w-7.5 shrink-0 text-primary"
        aria-hidden="true"
        viewBox="0 0 32 34"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M5 10h22l2 21H3L5 10Z" />
        <path d="M11 12V7a5 5 0 0 1 10 0v5" /></svg
      ><span>Store<span aria-hidden="true">.</span></span></a
    >
    <nav
      class="flex min-w-0 flex-wrap items-center gap-3 sm:gap-7 ml-auto"
      aria-label="Main navigation"
    >
      <a
        class="inline-flex min-h-11 items-center gap-2 text-sm font-semibold no-underline hover:text-primary hover:underline"
        routerLink="/"
        >Products</a
      ><a
        class="inline-flex min-h-11 items-center gap-2 text-sm font-semibold no-underline hover:text-primary hover:underline"
        routerLink="/cart"
        ><svg
          class="hidden size-5 shrink-0 sm:block"
          aria-hidden="true"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
        >
          <path d="M3 3h2l3 13h11l2-9H6" />
          <circle cx="9" cy="21" r="1" />
          <circle cx="19" cy="21" r="1" /></svg
        >{{ 'cart.title' | translate }}</a
      ><a
        class="inline-flex min-h-11 items-center gap-2 text-sm font-semibold no-underline hover:text-primary hover:underline"
        routerLink="/profile"
        >{{ 'cart.profile' | translate }}</a
      >
    </nav>
    <!-- Búsqueda: un único control compartido entre escritorio y móvil. -->
    <div class="relative w-full lg:w-90 lg:shrink-0">
      <svg
        class="pointer-events-none absolute top-3.5 left-3.5 size-5 text-muted"
        aria-hidden="true"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
      >
        <circle cx="10.5" cy="10.5" r="7.5" />
        <path d="m16 16 5 5" /></svg
      ><input
        class="aria-invalid:border-danger w-full border-line bg-surface pl-11"
        type="search"
        autocomplete="off"
        [placeholder]="'products.header.search' | translate"
        [attr.aria-label]="'products.header.search' | translate"
        [value]="searchTerm"
        (input)="searchChange.emit($any($event.target).value)"
      />
    </div>
  </div>
</header>
