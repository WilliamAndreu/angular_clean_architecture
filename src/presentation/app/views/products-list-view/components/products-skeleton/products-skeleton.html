<!-- Carga: misma cuadrícula y proporciones que las tarjetas del catálogo. -->
<div role="status">
  <span class="sr-only">{{ 'common.loading' | translate }}</span>
  <div
    class="skeleton-group grid grid-cols-1 gap-x-4 gap-y-6 xs:grid-cols-2 md:grid-cols-3 md:gap-x-6 md:gap-y-8 xl:grid-cols-4"
    aria-hidden="true"
  >
    @for (item of placeholders; track item) {
      <div>
        <div class="skeleton aspect-square rounded-card"></div>
        <div class="mt-4 flex items-center justify-between gap-2">
          <div class="skeleton h-5 w-24"></div>
          <div class="skeleton h-5 w-10"></div>
        </div>
        <div class="skeleton mt-1.5 h-6 w-4/5"></div>
        <div class="skeleton mt-2 h-7 w-20"></div>
      </div>
    }
  </div>
</div>
