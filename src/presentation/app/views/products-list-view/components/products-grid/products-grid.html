<!-- Cuadrícula: identidad estable por producto. -->
<div
  class="grid grid-cols-1 gap-x-4 gap-y-6 xs:grid-cols-2 md:grid-cols-3 md:gap-x-6 md:gap-y-8 xl:grid-cols-4"
>
  @for (product of products; track product.id) {
    <app-product-card class="content-enter" [product]="product" />
  } @empty {
    <!-- Estado vacío: conserva el contexto de búsqueda. -->
    <div class="content-enter col-span-full px-6 py-18 text-center">
      <h2 class="mb-3 text-2xl font-semibold">No products found</h2>
      <p class="text-muted">Try another search or choose a different category.</p>
      @if (searchTerm) {
        <p class="text-muted">No results for &ldquo;{{ searchTerm }}&rdquo;</p>
      }
    </div>
  }
</div>
