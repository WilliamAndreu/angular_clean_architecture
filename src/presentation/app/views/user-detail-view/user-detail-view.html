<!-- Navegación: catálogo y carrito. -->
<app-detail-header backLabel="Products" backRoute="/" />
<main
  class="view-enter mx-auto w-full max-w-shell px-5 pt-5 pb-12 md:px-12 md:pt-5 md:pb-18"
  [attr.aria-busy]="vm.viewState.isLoading()"
>
  <!-- Cabecera de cuenta. -->
  <h1 class="text-display font-bold">Your account</h1>
  <p class="mt-3 max-w-copy text-muted">Your profile, all in one place.</p>
  <!-- Estados: carga y error de la sesión. -->
  @if (vm.viewState.isLoading()) {
    <app-user-detail-skeleton class="mt-10 block max-w-200" />
  }
  @if (vm.viewState.error(); as error) {
    <app-user-detail-error class="mt-7 block" [message]="error" />
  }
  <!-- Perfil: datos del usuario autenticado. -->
  @if (vm.viewState.user(); as user) {
    <app-user-profile-card
      class="content-enter mt-10 block max-w-200"
      [user]="user"
      (logout)="vm.logout()"
    />
  }
</main>
