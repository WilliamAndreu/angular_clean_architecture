<!-- Identidad: avatar y nombre del usuario. -->
<section aria-label="Profile details">
  <div class="flex items-center gap-4 pb-8 sm:gap-6">
    <img
      class="size-18 shrink-0 rounded-full bg-surface object-cover sm:size-24"
      [src]="user.image"
      alt=""
      width="96"
      height="96"
    />
    <div>
      <h2 class="text-2xl font-semibold sm:text-3xl">{{ user.firstName }} {{ user.lastName }}</h2>
      <p class="mt-2 text-muted">@{{ user.username }}</p>
    </div>
  </div>
  <!-- Datos de la cuenta: pares de etiqueta y valor. -->
  <dl class="m-0 border-t border-line">
    <div
      class="grid grid-cols-1 gap-2 border-b border-line py-5 sm:grid-cols-[--spacing(40)_minmax(0,1fr)] sm:gap-6 sm:py-6"
    >
      <dt class="text-muted">{{ 'profile.email' | translate }}</dt>
      <dd class="m-0 font-semibold wrap-anywhere">{{ user.email }}</dd>
    </div>
    <div
      class="grid grid-cols-1 gap-2 border-b border-line py-5 sm:grid-cols-[--spacing(40)_minmax(0,1fr)] sm:gap-6 sm:py-6"
    >
      <dt class="text-muted">{{ 'profile.gender' | translate }}</dt>
      <dd class="m-0 font-semibold wrap-anywhere">{{ user.gender }}</dd>
    </div>
  </dl>
  <!-- Sesión: salida explícita de la cuenta. -->
  <div class="pt-8">
    <button
      type="button"
      class="inline-flex min-h-control items-center justify-center gap-2.5 rounded-control border px-5 py-3 text-center text-sm leading-snug font-bold no-underline transition-colors motion-safe:active:translate-y-px motion-reduce:transition-none border-danger-line bg-canvas text-danger not-disabled:hover:bg-danger-hover"
      (click)="logout.emit()"
    >
      {{ 'profile.sign_out' | translate }}
    </button>
  </div>
</section>
