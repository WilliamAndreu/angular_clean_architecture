<!-- Carga: identidad y filas de perfil con el espaciado del contenido final. -->
<div role="status">
  <span class="sr-only">{{ 'common.loading' | translate }}</span>
  <div class="skeleton-group" aria-hidden="true">
    <div class="flex items-center gap-4 pb-8 sm:gap-6">
      <div class="skeleton size-18 shrink-0 rounded-full sm:size-24"></div>
      <div class="min-w-0 flex-1">
        <div class="skeleton h-8 w-3/4 max-w-80 sm:h-9"></div>
        <div class="skeleton mt-2 h-6 w-1/2 max-w-45"></div>
      </div>
    </div>
    <div class="border-t border-line">
      @for (item of [0, 1]; track item) {
        <div
          class="grid grid-cols-1 gap-2 border-b border-line py-5 sm:grid-cols-[--spacing(40)_minmax(0,1fr)] sm:gap-6 sm:py-6"
        >
          <div class="skeleton h-6 w-20"></div>
          <div class="skeleton h-6 w-3/4 max-w-80"></div>
        </div>
      }
    </div>
    <div class="skeleton mt-8 h-control w-28"></div>
  </div>
</div>
