<!-- Galería: imagen seleccionada del producto. -->
<div class="aspect-square overflow-hidden rounded-gallery bg-surface">
  <img
    class="size-full object-contain p-6 sm:p-10"
    appImgFallback
    [src]="product.images[activeImage] || product.thumbnail"
    [alt]="product.title"
    width="600"
    height="600"
  />
</div>
<!-- Miniaturas: selección accesible de imágenes. -->
@if (product.images.length > 1) {
  <div class="mt-4 flex flex-wrap gap-3" role="group" aria-label="Product images">
    @for (img of product.images; track $index) {
      <button
        class="size-20 rounded-control border border-line bg-surface p-1 aria-pressed:border-2 aria-pressed:border-primary"
        type="button"
        [attr.aria-pressed]="activeImage === $index"
        [attr.aria-label]="'View image ' + ($index + 1) + ' of ' + product.title"
        (click)="activeImageChange.emit($index)"
      >
        <img
          class="size-full object-contain"
          appImgFallback
          [src]="img"
          alt=""
          loading="lazy"
          width="80"
          height="80"
        />
      </button>
    }
  </div>
}
