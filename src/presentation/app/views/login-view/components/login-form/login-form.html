<!-- Formulario: validación local y estado de autenticación. -->
<form class="grid gap-5" [formGroup]="form" (ngSubmit)="onSubmit()" [attr.aria-busy]="isLoading">
  <!-- Error de acceso: mantiene disponibles los campos para corregirlos. -->
  @if (error) {
    <p
      class="view-enter rounded-notice border px-5 py-4 text-sm border-danger-line bg-danger-surface text-danger"
      role="alert"
    >
      {{ error | translate }}
    </p>
  }
  <!-- Usuario: etiqueta persistente y autocompletado. -->
  <div class="grid gap-2">
    <label for="username">Username</label
    ><input
      class="aria-invalid:border-danger w-full"
      id="username"
      formControlName="username"
      type="text"
      autocomplete="username"
      placeholder="Enter your username"
      required
      [attr.aria-invalid]="form.controls.username.touched && form.controls.username.invalid"
      [attr.aria-describedby]="
        form.controls.username.touched && form.controls.username.invalid ? 'username-error' : null
      "
    />
    @if (form.controls.username.touched && form.controls.username.invalid) {
      <p id="username-error" class="text-caption text-danger">Enter your username.</p>
    }
  </div>
  <!-- Contraseña: no bloquea el pegado ni el gestor de contraseñas. -->
  <div class="grid gap-2">
    <label for="password">Password</label
    ><input
      class="aria-invalid:border-danger w-full"
      id="password"
      formControlName="password"
      type="password"
      autocomplete="current-password"
      placeholder="Enter your password"
      required
      [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
      [attr.aria-describedby]="
        form.controls.password.touched && form.controls.password.invalid ? 'password-error' : null
      "
    />
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <p id="password-error" class="text-caption text-danger">Enter your password.</p>
    }
  </div>
  <!-- Envío: estado de carga con nombre accesible. -->
  <button
    type="submit"
    class="inline-flex min-h-control items-center justify-center gap-2.5 rounded-control border px-5 py-3 text-center text-sm leading-snug font-bold no-underline transition-colors motion-safe:active:translate-y-px motion-reduce:transition-none border-primary bg-primary text-canvas not-disabled:hover:bg-primary-hover mt-1 w-full"
    [disabled]="isLoading"
  >
    @if (isLoading) {
      Signing in…
    } @else {
      Sign in
    }
  </button>
</form>
